name: Workspace quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            renovate/*) echo "Renovate branch exempt: $HEAD_REF"; exit 0 ;;
          esac
          if ! printf '%s\n' "$HEAD_REF" | grep -Eq '^(feature|bugfix|chore|refactor)/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Branch '$HEAD_REF' must match (feature|bugfix|chore|refactor)/<lowercase-kebab>" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @glacier/logger exec playwright install --with-deps chromium
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Run workspace quality gate
        run: pnpm exec turbo run ci --force
      - name: Retain tooling, catalog and library diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/artifacts/
            packages/libraries/glacier-reflection/tests/artifacts/
          if-no-files-found: warn
          retention-days: 7
